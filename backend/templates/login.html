<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Checker — Sign in</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-head">
            <h1>Domain Checker</h1>
            <p id="loginSubtitle">Sign in to continue</p>
        </div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="text" id="loginEmail" autocomplete="username" placeholder="admin@checker.local">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Your password">
            </div>

            <div class="login-error" id="loginError"></div>

            <button type="submit" class="btn-primary login-submit" id="loginSubmit">Sign in</button>
        </form>

        <div class="login-toggle">
            <span>No account? Ask an admin to create one for you.</span>
        </div>
    </div>

    <script>
        function showLoginError(message) {
            const el = document.getElementById("loginError");
            el.textContent = message || "";
            el.classList.toggle("active", Boolean(message));
        }

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            if (!email || !password) {
                showLoginError("Enter your email and password");
                return;
            }

            const button = document.getElementById("loginSubmit");
            button.disabled = true;
            showLoginError("");

            try {
                const resp = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await resp.json().catch(() => ({}));

                if (!resp.ok) {
                    showLoginError(data.error || "Sign-in failed");
                    button.disabled = false;
                    return;
                }

                window.location.reload();
            } catch (e) {
                showLoginError("Network error: " + e.message);
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
