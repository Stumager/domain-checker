services:
  checker:
    build: ./backend
    container_name: domain-checker
    # Reuses the same backend/.env the local run uses; only the values that
    # differ inside the network are overridden below.
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # Container-to-container: the scraper's own port, not the published 8090.
      GMAPS_API_URL: http://gmaps-scraper:8080
    # Bound to loopback on purpose. Publishing a port writes its own iptables
    # rules and bypasses ufw, so "0.0.0.0:8080" would be open to the internet
    # regardless of the firewall. Put a reverse proxy in front for public access.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - checker-data:/app/data
    depends_on:
      - gmaps-scraper
    restart: unless-stopped

  gmaps-scraper:
    image: gosom/google-maps-scraper
    container_name: gmaps-scraper
    # ENTRYPOINT образа — сам бинарник, поэтому здесь только его аргументы.
    # Без -data-folder веб-режим (REST API на :8080) не поднимается.
    #
    # -c задан явно: по умолчанию это «половина ядер», а на одноядерной машине
    # целочисленное деление даёт 0, и скрапер падает с
    # `panic: Concurrency must be greater than 0`, уходя в бесконечный рестарт.
    # На машине пожирнее это число можно поднять.
    command: ["-data-folder", "/gmapsdata", "-cache", "/gmapscache", "-c", "1"]
    # The scraper API has no authentication of any kind. checker reaches it over
    # the compose network as http://gmaps-scraper:8080, so this mapping exists
    # only for local debugging and must never leave loopback.
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - gmaps-cache:/gmapscache
      - gmaps-data:/gmapsdata
    restart: unless-stopped

volumes:
  checker-data:
  gmaps-cache:
  gmaps-data:
